<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhD Timeline - Yehezkiel's Gantt Chart</title>
  <meta name="description"
    content="Interactive Gantt chart for Yehezkiel's PhD journey at ANU RSES - 3-year plan with live status tracking." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loader-container">
      <div class="loader-ring"></div>
      <p class="loader-text">Loading PhD Timeline...</p>
      <p class="loader-subtext">Preparing Gantt chart</p>
    </div>
  </div>

  <!-- Error overlay -->
  <div id="error-overlay" class="hidden">
    <div class="error-container">
      <div class="error-icon">&#x26A0;&#xFE0F;</div>
      <h2>Could not load timeline</h2>
      <p id="error-message"></p>
      <button id="retry-btn" class="btn-primary">Retry</button>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="hidden">
    <!-- Header -->
    <header id="header">
      <div class="header-content">
        <div class="header-left">
          <h1>
            <span class="header-icon">&#x1F393;</span>
            <span>PhD Timeline</span>
          </h1>
          <p class="header-subtitle">Yehezkiel - ANU RSES - 3-Year Plan</p>
        </div>
        <div class="header-right">
          <div class="header-stats" id="header-stats"></div>
          <button id="refresh-btn" class="btn-icon" title="Refresh data">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10" />
              <polyline points="1 20 1 14 7 14" />
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Key dates strip -->
    <section id="key-dates" class="key-dates-strip"></section>

    <!-- Controls bar -->
    <section id="controls-bar">
      <div class="controls-content">
        <div class="filter-group">
          <label for="phase-filter">Phase</label>
          <select id="phase-filter">
            <option value="all">All Phases</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="status-filter">Status</label>
          <select id="status-filter">
            <option value="all">All Statuses</option>
            <option value="Done">Done</option>
            <option value="In progress">In Progress</option>
            <option value="Delayed">Delayed</option>
            <option value="Not started">Not Started</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="type-filter">Type</label>
          <select id="type-filter">
            <option value="all">All Types</option>
            <option value="Task">Task</option>
            <option value="Milestone">Milestone</option>
          </select>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot done"></span>Done</span>
          <span class="legend-item"><span class="legend-dot urgent-progress"></span>Due &lt;1m - In Progress</span>
          <span class="legend-item"><span class="legend-dot urgent-delayed"></span>Due &lt;1m - Delayed</span>
          <span class="legend-item"><span class="legend-dot urgent-not-started"></span>Due &lt;1m - Not Started</span>
          <span class="legend-item"><span class="legend-dot default"></span>Normal</span>
        </div>
      </div>
    </section>

    <!-- Gantt chart -->
    <main id="gantt-wrapper">
      <div id="gantt-container">
        <!-- Left panel: task list -->
        <div id="task-panel">
          <div class="task-panel-header">
            <div class="tp-cell tp-id">ID</div>
            <div class="tp-cell tp-task">Task</div>
            <div class="tp-cell tp-type">Type</div>
            <div class="tp-cell tp-status">Status</div>
            <div class="tp-cell tp-owner">Owner</div>
          </div>
          <div id="task-panel-body"></div>
        </div>
        <!-- Right panel: timeline bars -->
        <div id="timeline-panel">
          <div id="timeline-header"></div>
          <div id="timeline-body"></div>
        </div>
      </div>
    </main>

    <!-- Today indicator label -->
    <div id="today-label" class="hidden">Today</div>

    <!-- Footer -->
    <footer id="footer">
      <p>Last refreshed: <span id="last-refresh">-</span> - Data synced via GitHub Actions</p>
    </footer>
  </div>

  <!-- Tooltip -->
  <div id="tooltip" class="hidden"></div>

  <!-- No SheetJS needed - we load from data.json directly -->
  <script src="app.js"></script>
</body>

</html>
